name: Serum 2 Preset Maker

on:
  push:
    paths:
      - "Serum2-Preset-Maker/**"
      - ".github/workflows/serum2-preset-maker.yml"
  pull_request:
    paths:
      - "Serum2-Preset-Maker/**"
      - ".github/workflows/serum2-preset-maker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serum2-preset-maker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows - test, build installer, install/uninstall check
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preset engine tests
        run: |
          node Serum2-Preset-Maker/test/verify.js
          if ($LASTEXITCODE -ne 0) { throw "engine tests failed" }

      - name: Build installer (Inno Setup)
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force build/installer | Out-Null
          $out = Resolve-Path build/installer
          & $iscc "/DOutputDir=$out" Serum2-Preset-Maker/Installer/SerumPresetMaker.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem build/installer | Format-Table Name, Length

      - name: Installer - silent install and file check
        run: |
          $setup = Get-ChildItem build/installer -Filter "Serum 2 Preset Maker Setup.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Serum 2 Preset Maker"
          foreach ($f in "index.html", "engine.js", "README.md") { if (-not (Test-Path "$app\$f")) { throw "missing after install: $app\$f" } }
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Serum 2 Preset Maker.lnk"
          if (-not (Test-Path $menu)) { throw "Start menu shortcut missing" }
          $desk = Join-Path ([Environment]::GetFolderPath("Desktop")) "Serum 2 Preset Maker.lnk"
          if (-not (Test-Path $desk)) { throw "desktop shortcut missing" }
          if ((Get-FileHash "$app\engine.js").Hash -ne (Get-FileHash Serum2-Preset-Maker/engine.js).Hash) { throw "installed engine differs" }
          "install: OK"

      - name: Installer - silent uninstall and removal check
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Programs\Serum 2 Preset Maker"
          $unins = Get-ChildItem $app -Filter "unins*.exe" | Select-Object -First 1
          if (-not $unins) { throw "uninstaller not found" }
          $p = Start-Process -FilePath $unins.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\index.html"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\index.html") { throw "files still present after uninstall" }
          "uninstall: OK"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Serum-2-Preset-Maker-Setup
          path: build/installer/
